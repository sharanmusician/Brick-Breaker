<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AETHERCORE // ELITE CIRCUIT</title>
    <style>
        :root {
            --gold: #C5A059; --slate: #0D0F12; --surface: #1A1D21;
            --danger: #FF4B4B; --white: #FFFFFF; --info: #00D1FF;
            --hard: #555555; --explosive: #FF8C00; --trap: #8B0000;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--slate); color: var(--white);
            font-family: 'Inter', -apple-system, sans-serif; overflow: hidden;
        }

        #hud {
            position: absolute; top: env(safe-area-inset-top, 15px);
            width: 100%; display: flex; justify-content: space-between;
            padding: 0 25px; z-index: 10; pointer-events: none;
        }
        .metric { display: flex; flex-direction: column; }
        .label { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4); font-weight: 800; }
        .value { font-family: monospace; font-size: 22px; color: var(--gold); }

        #modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal {
            width: 88%; max-width: 380px; padding: 35px;
            background: var(--surface); border: 1px solid rgba(197,160,89,0.3);
            text-align: center; border-radius: 4px;
        }
        h2 { font-weight: 300; letter-spacing: 6px; margin: 0 0 10px 0; color: var(--gold); font-size: 22px; }
        p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 30px; }
        
        .btn {
            background: var(--gold); color: var(--slate); border: none;
            padding: 18px; font-weight: 800; letter-spacing: 3px;
            width: 100%; text-transform: uppercase; cursor: pointer; border-radius: 2px;
        }

        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    </style>
</head>
<body>

<div id="hud">
    <div class="metric"><span class="label">SECTOR</span><span id="lvl-ui">01</span> / 10</div>
    <div class="metric" style="text-align:right"><span class="label">STABILITY</span><span id="time-ui">60.0</span></div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="m-title">AETHERCORE</h2>
        <p id="m-desc">Initialising Quantum Stream...</p>
        <button class="btn" onclick="game.handleAction()">Commence</button>
    </div>
</div>

<canvas id="stage"></canvas>

<script>
const game = {
    lvl: 1, time: 60, active: false,
    ball: { x:0, y:0, dx:0, dy:0, r:7, speed: 5 },
    paddle: { x:0, w:120, h:8, y:0 },
    bricks: [], state: 'INTRO',
    levelData: [
        { name: "REINFORCED", desc: "Sector 01: Hard nodes require triple impact to neutralize." },
        { name: "COMBUSTION", desc: "Sector 02: Explosive nodes will clear nearby data streams." },
        { name: "DRIFT", desc: "Sector 03: Kinetic nodes move laterally. Track trajectories." },
        { name: "STEALTH", desc: "Sector 04: Invisible nodes. Impact reveals position." },
        { name: "RECURSION", desc: "Sector 05: Regenerating nodes. Quick neutralization required." },
        { name: "WARP", desc: "Sector 06: Teleport nodes. Signal will jump between portals." },
        { name: "VELOCITY", desc: "Sector 07: High-speed node variance. Timing is critical." },
        { name: "SINGULARITY", desc: "Sector 08: Magnetic nodes. Gravity pulls the signal." },
        { name: "PHASE", desc: "Sector 09: Ghost nodes. Signal passes through on first hit." },
        { name: "CORE_ZERO", desc: "Sector 10: Final sector. Trap nodes and active bombs detected." }
    ],

    init() {
        this.canvas = document.getElementById('stage');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        
        const input = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            this.paddle.x = x - this.paddle.w/2;
            this.paddle.x = Math.max(0, Math.min(window.innerWidth - this.paddle.w, this.paddle.x));
        };
        window.addEventListener('mousemove', input);
        window.addEventListener('touchmove', (e) => { input(e); e.preventDefault(); }, {passive:false});
        window.addEventListener('resize', () => this.resize());
        this.setupLevel();
        this.updateModal();
    },

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.ctx.scale(dpr, dpr);
    },

    updateModal() {
        const data = this.levelData[this.lvl - 1];
        document.getElementById('m-title').innerText = data.name;
        document.getElementById('m-desc').innerText = data.desc;
    },

    setupLevel() {
        this.time = 65 - (this.lvl * 5); // Faster timer scaling for 10 levels
        this.ball.speed = 5 + (this.lvl * 0.4);
        this.bricks = [];
        const cols = window.innerWidth < 600 ? 5 : 8;
        const rows = 5;
        const pad = 10;
        const bW = (window.innerWidth - (pad * (cols + 1))) / cols;

        for(let c=0; c<cols; c++) {
            for(let r=0; r<rows; r++) {
                let type = 'normal';
                let hp = 1;
                let roll = Math.random();

                // Specific Level Mechanics
                if (this.lvl >= 1 && roll > 0.8) { type = 'hard'; hp = 3; }
                if (this.lvl >= 2 && roll > 0.9) { type = 'explosive'; }
                if (this.lvl >= 3 && roll > 0.85) { type = 'moving'; }
                if (this.lvl >= 10 && roll > 0.8) { type = 'trap'; }

                this.bricks.push({
                    x: pad + c * (bW + pad), y: 120 + r * (24 + pad),
                    w: bW, h: 20, active: true, type, hp, 
                    origX: pad + c * (bW + pad), v: 2.5
                });
            }
        }
        this.paddle.y = window.innerHeight - 80;
        this.paddle.x = window.innerWidth/2 - this.paddle.w/2;
        this.ball.x = window.innerWidth/2;
        this.ball.y = this.paddle.y - 15;
        this.ball.dx = this.ball.speed * (Math.random() > 0.5 ? 1 : -1);
        this.ball.dy = -this.ball.speed;
    },

    handleAction() {
        if(this.state === 'INTRO' || this.state === 'WIN') this.start();
        else if(this.state === 'FAIL') { this.lvl = 1; this.setupLevel(); this.start(); }
    },

    start() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('lvl-ui').innerText = this.lvl.toString().padStart(2, '0');
        this.active = true;
        this.lastT = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    },

    loop(t) {
        if(!this.active) return;
        const dt = (t - this.lastT) / 1000;
        this.lastT = t;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    },

    update(dt) {
        this.time -= dt;
        document.getElementById('time-ui').innerText = Math.max(0, this.time).toFixed(1);
        
        // Gradual speed scaling
        this.ball.speed += dt * 0.18;

        if(this.time <= 0) return this.end(false);

        this.ball.x += this.ball.dx;
        this.ball.y += this.ball.dy;

        if(this.ball.x < 0 || this.ball.x > window.innerWidth) this.ball.dx *= -1;
        if(this.ball.y < 0) this.ball.dy *= -1;
        if(this.ball.y > window.innerHeight) return this.end(false);

        if(this.ball.y > this.paddle.y && this.ball.x > this.paddle.x && this.ball.x < this.paddle.x + this.paddle.w) {
            this.ball.dy = -Math.abs(this.ball.dy);
            let tilt = (this.ball.x - (this.paddle.x + this.paddle.w/2)) / (this.paddle.w/2);
            this.ball.dx = tilt * this.ball.speed;
        }

        let rem = 0;
        this.bricks.forEach(b => {
            if(!b.active) return;
            rem++;
            
            if(b.type === 'moving') {
                b.x += b.v;
                if(b.x > b.origX + 30 || b.x < b.origX - 30) b.v *= -1;
            }

            if(this.ball.x > b.x && this.ball.x < b.x + b.w && this.ball.y > b.y && this.ball.y < b.y + b.h) {
                this.ball.dy *= -1;
                b.hp--;
                if(b.hp <= 0) {
                    b.active = false;
                    if(b.type === 'explosive') this.explode(b);
                    if(b.type === 'trap') { 
                        this.paddle.w = 70; 
                        setTimeout(() => this.paddle.w = 120, 4000); 
                    }
                }
            }
        });
        if(rem === 0) this.end(true);
    },

    explode(origin) {
        this.bricks.forEach(b => {
            if(b.active && Math.hypot(b.x - origin.x, b.y - origin.y) < 110) b.active = false;
        });
    },

    end(win) {
        this.active = false;
        this.state = win ? 'WIN' : 'FAIL';
        if(win && this.lvl < 10) {
            this.lvl++;
            this.setupLevel();
            this.updateModal();
        } else if(!win) {
            document.getElementById('m-title').innerText = "LOCKOUT";
            document.getElementById('m-desc').innerText = "Sector stability lost. Connection terminated.";
        } else {
            document.getElementById('m-title').innerText = "CIRCUIT COMPLETE";
            document.getElementById('m-desc').innerText = "All sectors secured. Quantum dominance achieved.";
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    },

    draw() {
        this.ctx.fillStyle = '#0D0F12';
        this.ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

        this.bricks.forEach(b => {
            if(!b.active) return;
            if(b.type === 'hard') this.ctx.fillStyle = b.hp === 3 ? '#555' : b.hp === 2 ? '#333' : '#111';
            else if(b.type === 'explosive') this.ctx.fillStyle = 'var(--explosive)';
            else if(b.type === 'trap') this.ctx.fillStyle = 'var(--trap)';
            else this.ctx.fillStyle = 'var(--gold)';
            
            this.ctx.fillRect(b.x, b.y, b.w, b.h);
        });

        this.ctx.fillStyle = 'white';
        this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h);
        this.ctx.beginPath();
        this.ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI*2);
        this.ctx.fill();
    }
};

window.onload = () => game.init();
</script>
</body>
</html>
