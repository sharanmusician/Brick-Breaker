<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AETHERCORE // QUANTUM STRIKE</title>
    <style>
        :root {
            --gold: #C5A059; --slate: #0D0F12; --surface: #1A1D21;
            --danger: #FF4B4B; --white: #FFFFFF; --success: #4CAF50;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--slate); color: var(--white);
            font-family: -apple-system, sans-serif; overflow: hidden;
        }

        /* Responsive HUD */
        #hud {
            position: absolute; top: env(safe-area-inset-top, 15px);
            width: 100%; display: flex; justify-content: space-between;
            padding: 0 20px; z-index: 10; pointer-events: none;
        }
        .metric { display: flex; flex-direction: column; }
        .label { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.4); font-weight: 800; }
        .value { font-family: monospace; font-size: 18px; color: var(--gold); }

        /* Professional Modal System */
        #modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal {
            width: 85%; max-width: 350px; padding: 30px;
            background: var(--surface); border: 1px solid rgba(197,160,89,0.3);
            text-align: center; border-radius: 4px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        h2 { font-weight: 300; letter-spacing: 6px; margin: 0 0 10px 0; color: var(--gold); font-size: 20px; }
        p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; margin-bottom: 25px; }
        
        .btn {
            background: var(--gold); color: var(--slate); border: none;
            padding: 15px; font-weight: 800; letter-spacing: 2px;
            width: 100%; text-transform: uppercase; cursor: pointer; border-radius: 2px;
        }

        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    </style>
</head>
<body>

<div id="hud">
    <div class="metric"><span class="label">LEVEL</span><span id="lvl-ui">01</span></div>
    <div class="metric" style="text-align:right"><span class="label">STABILITY</span><span id="time-ui">60.0</span></div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="m-title">AETHERCORE</h2>
        <p id="m-desc">Neural link established. Sector 01 requires immediate node neutralization. Time is limited.</p>
        <button class="btn" id="m-btn" onclick="game.handleModalAction()">Initialize</button>
    </div>
</div>

<canvas id="stage"></canvas>

<script>
const game = {
    lvl: 1, score: 0, time: 60, active: false,
    ball: { x:0, y:0, dx:0, dy:0, r:6, baseSpeed: 5, currentSpeed: 5 },
    paddle: { x:0, w:110, h:8, y:0 },
    bricks: [], 
    state: 'INTRO', // INTRO, LEVEL_WIN, GAME_OVER

    init() {
        this.canvas = document.getElementById('stage');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        const move = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            this.paddle.x = x - this.paddle.w/2;
            if(this.paddle.x < 0) this.paddle.x = 0;
            if(this.paddle.x > window.innerWidth - this.paddle.w) this.paddle.x = window.innerWidth - this.paddle.w;
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', (e) => { move(e); e.preventDefault(); }, {passive:false});
        this.setupLevel();
    },

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.ctx.scale(dpr, dpr);
    },

    setupLevel() {
        this.time = 62 - (this.lvl * 2); 
        this.ball.currentSpeed = this.ball.baseSpeed + (this.lvl * 0.5);
        this.bricks = [];
        
        const cols = window.innerWidth < 600 ? 5 : 8;
        const rows = 4 + Math.floor(this.lvl/4);
        const pad = 8;
        const bW = (window.innerWidth - (pad * (cols + 1))) / cols;

        for(let c=0; c<cols; c++) {
            for(let r=0; r<rows; r++) {
                let type = 'normal';
                let hp = 1;
                // Level-based Brick Injection
                if (this.lvl >= 2 && Math.random() > 0.8) { type = 'hard'; hp = 3; }
                if (this.lvl >= 3 && Math.random() > 0.9) { type = 'explosive'; }
                if (this.lvl >= 5 && Math.random() > 0.9) { type = 'speed'; }
                
                this.bricks.push({
                    x: pad + c * (bW + pad), y: 100 + r * (22 + pad),
                    w: bW, h: 18, active: true, type: type, hp: hp
                });
            }
        }
        this.paddle.y = window.innerHeight - 70;
        this.paddle.x = window.innerWidth/2 - this.paddle.w/2;
        this.resetBall();
    },

    resetBall() {
        this.ball.x = window.innerWidth/2;
        this.ball.y = this.paddle.y - 15;
        this.ball.dx = this.ball.currentSpeed * (Math.random() > 0.5 ? 1 : -1);
        this.ball.dy = -this.ball.currentSpeed;
    },

    handleModalAction() {
        if(this.state === 'INTRO' || this.state === 'LEVEL_WIN') {
            this.start();
        } else if(this.state === 'GAME_OVER') {
            this.lvl = 1;
            this.setupLevel();
            this.start();
        }
    },

    start() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('lvl-ui').innerText = this.lvl.toString().padStart(2, '0');
        this.active = true;
        this.lastT = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    },

    loop(t) {
        if(!this.active) return;
        const dt = (t - this.lastT) / 1000;
        this.lastT = t;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    },

    update(dt) {
        this.time -= dt;
        document.getElementById('time-ui').innerText = Math.max(0, this.time).toFixed(1);
        
        // Gradual speed increase (Entropy scaling)
        this.ball.currentSpeed += dt * 0.15; 
        const speedRatio = this.ball.currentSpeed / Math.sqrt(this.ball.dx**2 + this.ball.dy**2);
        this.ball.dx *= speedRatio;
        this.ball.dy *= speedRatio;

        if(this.time <= 0) return this.endGame(false);

        this.ball.x += this.ball.dx;
        this.ball.y += this.ball.dy;

        // Physics
        if(this.ball.x < 0 || this.ball.x > window.innerWidth) this.ball.dx *= -1;
        if(this.ball.y < 0) this.ball.dy *= -1;
        if(this.ball.y > window.innerHeight) return this.endGame(false);

        // Paddle
        if(this.ball.y > this.paddle.y && this.ball.x > this.paddle.x && this.ball.x < this.paddle.x + this.paddle.w) {
            this.ball.dy = -Math.abs(this.ball.dy);
            let impact = (this.ball.x - (this.paddle.x + this.paddle.w/2)) / (this.paddle.w/2);
            this.ball.dx = impact * this.ball.currentSpeed;
        }

        // Bricks
        let rem = 0;
        this.bricks.forEach(b => {
            if(!b.active) return;
            rem++;
            if(this.ball.x > b.x && this.ball.x < b.x + b.w && this.ball.y > b.y && this.ball.y < b.y + b.h) {
                this.ball.dy *= -1;
                b.hp--;
                if(b.hp <= 0) {
                    b.active = false;
                    if(b.type === 'explosive') this.triggerExplosion(b);
                }
            }
        });

        if(rem === 0) this.winLevel();
    },

    triggerExplosion(origin) {
        this.bricks.forEach(b => {
            if(b.active && Math.hypot(b.x - origin.x, b.y - origin.y) < 80) b.active = false;
        });
    },

    winLevel() {
        this.active = false;
        if(this.lvl >= 14) {
            this.showModal("ARCHIVE SECURED", "You have successfully cleared all 14 sectors. Final core access granted.", "Restart", "INTRO");
        } else {
            this.lvl++;
            this.state = 'LEVEL_WIN';
            this.setupLevel();
            this.showModal("SECTOR CLEARED", `Level ${this.lvl-1} nodes neutralized. Synchronizing for Level ${this.lvl}. Stability time reduced.`, "Proceed", "LEVEL_WIN");
        }
    },

    endGame(win) {
        this.active = false;
        this.state = 'GAME_OVER';
        this.showModal("CONNECTION LOST", "Neural core destabilized. Signal lost at Sector " + this.lvl, "Re-Link", "GAME_OVER");
    },

    showModal(title, desc, btnText, state) {
        this.state = state;
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-btn').innerText = btnText;
        document.getElementById('modal-overlay').style.display = 'flex';
    },

    draw() {
        this.ctx.fillStyle = '#0D0F12';
        this.ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

        this.bricks.forEach(b => {
            if(!b.active) return;
            this.ctx.fillStyle = b.type === 'hard' ? '#555' : (b.type === 'explosive' ? '#FF4B4B' : '#C5A059');
            this.ctx.fillRect(b.x, b.y, b.w, b.h);
            if(b.type === 'hard') {
                this.ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                this.ctx.strokeRect(b.x+2, b.y+2, b.w-4, b.h-4);
            }
        });

        this.ctx.fillStyle = 'white';
        this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h);
        this.ctx.beginPath();
        this.ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI*2);
        this.ctx.fill();
    }
};

window.onload = () => game.init();
</script>
</body>
</html>
