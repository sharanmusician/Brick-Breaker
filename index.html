<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethercore | Zen Strike</title>
    <style>
        :root {
            --slate: #1e293b;
            --gold: #fbbf24;
            --emerald: #10b981;
            --crimson: #ef4444;
            --glass: rgba(15, 23, 42, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0f172a;
            color: white;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
        }

        #ui-header {
            position: absolute; top: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; box-sizing: border-box;
            background: var(--glass); border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .brand-text { font-weight: 800; letter-spacing: 2px; color: var(--gold); font-size: 14px; }
        .score-text { font-family: monospace; font-size: 20px; }

        #game-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        canvas {
            background: #020617;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            image-rendering: auto;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; text-align: center; padding: 20px;
        }

        h1 { font-size: 3rem; margin: 0; letter-spacing: -2px; }
        p { color: #94a3b8; margin-bottom: 30px; }

        .btn-start {
            background: var(--gold); color: #000;
            border: none; padding: 16px 40px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; border-radius: 4px;
            transition: transform 0.2s;
        }

        .btn-start:active { transform: scale(0.95); }

        /* PC View */
        @media (min-width: 768px) {
            canvas { border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
        }
    </style>
</head>
<body>

    <div id="ui-header">
        <div class="brand-text">AETHERCORE INTERACTIVE</div>
        <div class="score-text" id="score-val">0000</div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div id="overlay">
            <h1 id="status-title">ZEN STRIKE</h1>
            <p id="status-msg">Precision. Agility. Minimalist Combat.</p>
            <button class="btn-start" onclick="initGame()">Commence</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreVal = document.getElementById("score-val");
        const overlay = document.getElementById("overlay");

        let state = {
            running: false,
            score: 0,
            isMobile: window.innerWidth < 768
        };

        let ball = { x: 0, y: 0, dx: 0, dy: 0, r: 8 };
        let paddle = { w: 0, h: 10, x: 0 };
        let bricks = [];
        const config = { rows: 5, cols: 8, padding: 8 };

        function resize() {
            state.isMobile = window.innerWidth < 768;
            canvas.width = state.isMobile ? window.innerWidth : 800;
            canvas.height = state.isMobile ? window.innerHeight : 600;
            paddle.w = state.isMobile ? 100 : 120;
            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 60;
            ball.dx = (Math.random() - 0.5) * 8;
            ball.dy = -6;
        }

        function initBricks() {
            bricks = [];
            const bWidth = (canvas.width - (config.cols + 1) * config.padding) / config.cols;
            for (let c = 0; c < config.cols; c++) {
                bricks[c] = [];
                for (let r = 0; r < config.rows; r++) {
                    bricks[c][r] = { 
                        x: c * (bWidth + config.padding) + config.padding,
                        y: r * (25 + config.padding) + 80,
                        w: bWidth, h: 25, status: 1,
                        color: r % 2 === 0 ? '#fbbf24' : '#f59e0b'
                    };
                }
            }
        }

        function handleInput(e) {
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            let relX = clientX - rect.left;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relX - paddle.w/2));
        }

        window.addEventListener('mousemove', handleInput);
        window.addEventListener('touchmove', (e) => { handleInput(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('resize', resize);

        function initGame() {
            resize();
            initBricks();
            state.score = 0;
            state.running = true;
            overlay.style.display = 'none';
            loop();
        }

        function collision() {
            for (let c = 0; c < config.cols; c++) {
                for (let r = 0; r < config.rows; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            state.score += 100;
                            scoreVal.innerText = state.score.toString().padStart(4, '0');
                        }
                    }
                }
            }
        }

        function loop() {
            if (!state.running) return;

            ctx.clearRect(0,0,canvas.width, canvas.height);

            // Draw Bricks
            bricks.forEach(col => col.forEach(b => {
                if(b.status === 1) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                }
            }));

            // Draw Paddle
            ctx.fillStyle = "#fff";
            ctx.fillRect(paddle.x, canvas.height - 30, paddle.w, paddle.h);

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fill();

            // Physics
            if(ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
            if(ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
            else if(ball.y + ball.dy > canvas.height - 30) {
                if(ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    let impact = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
                    ball.dx = impact * 8;
                    ball.dy = -ball.dy;
                } else {
                    state.running = false;
                    document.getElementById('status-title').innerText = "SESSION TERMINATED";
                    overlay.style.display = 'flex';
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            collision();
            requestAnimationFrame(loop);
        }

        resize();
    </script>
</body>
</html>
